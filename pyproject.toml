[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "ingestion", "scoring", "api"]

[project]
name = "benrispace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pygeohash>=1.2",
    "mangum>=0.22",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6,<0.17",  # 0.17 disagrees with 0.16 on DTZ noqa directives
    "boto3>=1.34",
    # ingestion/school_districts.py tests (never in the Lambda bundle)
    "shapely>=2.0",
    "pyshp>=2.3",
    # scoring/embeddings.py similar_cells and ingestion/spatial.py (never in the Lambda bundle)
    "numpy>=1.26",
    "scipy>=1.11",
]
# School-district boundary + NCES school-location ingestion only; NOT in the Lambda bundle.
schools = [
    "shapely>=2.0",
    "pyshp>=2.3",
]
# Ingestion jobs (GitHub Actions): school / density / town polygons and the KD-tree
# spatial index. NOT in the Lambda bundle.
ingestion = [
    "shapely>=2.0",
    "pyshp>=2.3",
    "numpy>=1.26",
    "scipy>=1.11",
]
# Offline neighborhood-polygon prototype (ingestion/areas); NOT in the Lambda bundle.
geo = [
    "shapely>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

# Wave 4 routing precompute (ingestion/routing); NOT in the Lambda bundle. osmnx is only
# used by the exploratory scripts/routing_prototype.py.
routing = [
    "pandana>=0.7",
    "osmium>=4.0",  # Geofabrik extracts (ingestion/routing/pbf.py)
    "osmnx>=2.0",
    "numpy>=1.26",
    "shapely>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
