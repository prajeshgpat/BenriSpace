# Browser tests: Playwright against the production build, in Chromium and
# WebKit (Safari's engine, which would have caught the removeChild crash).
# The API and the basemap are mocked inside the browser (page.route), so the
# run needs no secrets and never touches the live API.

name: E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: https://api.e2e.test/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      # Playwright's webServer builds and starts the app (next build && next start).
      - name: Run E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
