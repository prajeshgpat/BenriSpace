# Weekly/monthly ingestion pipeline (docs/ROADMAP.md Phase 1: GitHub Actions is
# sufficient at this refresh cadence, no Airflow needed yet).
#
# Order matters: grid generation must run first (every other job writes
# feature_store rows keyed by geo_entity_id, which only exist after the
# grid is populated), the ingestion sources run ONE AT A TIME, and scoring
# runs last (it reads feature_store).
#
# Why sequential: every source updates different columns of the SAME
# feature_store rows, and a job's transaction holds those row locks until it
# commits (gtfs_transit holds them for ~10 minutes). Run in parallel, the
# first live run had osm_roads and trails wait on another job's locks until
# Postgres' 2-minute statement_timeout cancelled them. Local runs never hit
# this because they were always one at a time. Total runtime is the sum of
# the jobs (~45 min) rather than the longest, and the Actions minutes billed
# are about the same either way.
#
# Scoring runs even if one source failed: feature_store keeps the previous
# values for that source, and the failed job still turns the run red.
#
# Inert until DATABASE_URL is set as a repo secret — see docs/ROADMAP.md
# "Blocking Phase 1 today". STRAVA_CLIENT_ID/SECRET/REFRESH_TOKEN are optional;
# trails.py degrades gracefully when they are absent. NJ Transit's rail and bus
# GTFS feeds are now open downloads, so NJ_TRANSIT_API_KEY/USERNAME are unused
# (kept only so an old secret setup stays harmless).
#
# ingestion.trails' Strava enhancement is rate-limit-bound (~900 calls at
# 90/15min) and can take up to ~150 minutes on its own when Strava creds
# are set — timeout-minutes below is a safety ceiling, not the expected
# case. On a private repo this also eats real GitHub Actions minutes
# against the free-tier monthly budget (~600 min/month at weekly cadence)
# — worth knowing given this project's $0/month target (see docs/ROADMAP.md
# Cost Constraints).

name: Ingestion Pipeline

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — weekly refresh
  workflow_dispatch: {} # manual trigger for ad-hoc runs

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NJ_TRANSIT_API_KEY: ${{ secrets.NJ_TRANSIT_API_KEY }}
  NJ_TRANSIT_API_USERNAME: ${{ secrets.NJ_TRANSIT_API_USERNAME }}
  VALHALLA_URL: ${{ secrets.VALHALLA_URL }}
  STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
  STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
  STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m ingestion.grid

  ingest:
    needs: grid
    runs-on: ubuntu-latest
    timeout-minutes: 180 # trails.py's Strava enhancement can run ~150min; this is a safety ceiling
    strategy:
      fail-fast: false # one source failing shouldn't cancel the others
      max-parallel: 1 # see the lock-contention note at the top
      matrix:
        module: # cheap and reliable first; the slowest, flakiest source last
          - ingestion.airports
          - ingestion.schools
          - ingestion.gtfs_transit
          - ingestion.osm_poi
          - ingestion.osm_retail_parks # shopping + parks (migration 0009; v2.1 columns)
          - ingestion.neighborhoods
          - ingestion.roads
          - ingestion.trails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The schools job needs shapely/pyshp (the `schools` extra); the rest ignore it.
      - run: pip install -e ".[schools]"
      - run: python -m ${{ matrix.module }}

  score:
    needs: [grid, ingest]
    if: ${{ !cancelled() && needs.grid.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Written next to the v1 rows (unique per geo_entity + version); the API
      # keeps serving whichever version its SCORING_WEIGHTS_VERSION names.
      SCORING_WEIGHTS_VERSION: v2-handtuned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m scoring.run
      - run: python -m scoring.embeddings
