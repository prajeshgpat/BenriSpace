# Tests and lint before anything deploys. Work happens on `dev-benrispace`;
# `main` only changes through a reviewed pull request, and merging to `main`
# is what triggers the deploy workflows and the Amplify build. Running the
# checks here first means a broken change never costs a deploy.
#
# Cost controls:
#  * `changes` diffs against main and skips the Python or web job when none of
#    its files changed (a docs-only branch runs almost nothing).
#  * A newer push to the same branch cancels the run still in progress, so
#    a quick fix-up push doesn't pay for two full runs.
#  * `ci-ok` always runs and is the single status to require on PRs: a skipped
#    job counts as passing, a failed or cancelled one doesn't. (Path-filtered
#    workflows would leave a required check "pending" forever when skipped.)
#
# Infrastructure changes are validated separately by terraform.yml.

name: CI

on:
  push:
    branches: [dev-benrispace]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # runs everything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.diff.outputs.python }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need main's history to diff against

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything on this branch that main doesn't have yet.
          FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed vs main:"; echo "$FILES" | sed 's/^/  /'

          if echo "$FILES" | grep -qE '^(api|common|scoring|ingestion|tests|contracts|scripts)/|^pyproject\.toml$|^\.github/workflows/ci\.yml$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$FILES" | grep -qE '^web/|^contracts/openapi\.yaml$|^\.github/workflows/ci\.yml$'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: Python lint and tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the Lambda runtime's version
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  web:
    name: Web lint, typecheck, tests, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # lint + typecheck + unit tests + production build
      - run: npm run check

  ci-ok:
    name: ci-ok
    needs: [changes, python, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job that ran to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a CI job failed or was cancelled"; exit 1 ;;
          esac
