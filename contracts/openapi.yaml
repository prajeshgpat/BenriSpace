openapi: 3.0.3
info:
  title: BenriSpace API
  version: "0.6.0"
  description: >
    Phase 0 contract, plus the Phase 4 auth/rate-limit addition (non-breaking:
    new security requirement + new 401/429 responses, no existing fields
    changed). Three endpoints: score lookup, score explanation (generation
    lands in Phase 3, contract fixed now), and anchor-point triangulation
    (implementation lands in Phase 2, contract fixed now). All score data is
    read from precomputed storage — no live third-party API calls on the
    request path.

    Every request is attributed to an account (web session or Business-tier
    API key) so tier limits in `usage_counters` can be enforced — see Phase 4
    in `docs/ROADMAP.md`/`docs/ROADMAP.md`. Free tier requires sign-in too; there is no
    fully anonymous path.

servers:
  - url: /v1

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /area:
    get:
      summary: Score the area bounded by secondary-and-above roads that contains a point.
      description: >
        The area is a face of the network of secondary roads and above
        (secondary, primary, trunk, motorway and links), closed at the shore.
        Its sub-scores and composite are the area-weighted average of the
        latest scores of the geohash6 cells it overlaps (null factors are
        skipped per factor), so they track the latest scoring run. Returns 404
        when no area contains the point (or it is larger than the size cap);
        clients then fall back to the single-cell `/score`.
      operationId: getArea
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: double }
        - name: precision
          in: query
          description: >
            `grid` (default) returns the stored score of the containing grid cell.
            `point` scores the exact location on demand (an area: the mean of up to
            five sample points inside it) from live place queries and the metro's
            factor scales, and falls back to `grid` on any error. The response's
            `precision` says which was served.
          schema: { type: string, enum: [grid, point], default: grid }
      responses:
        "200":
          description: Area found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaScoreResponse"
        "400":
          description: Missing or invalid lat/lon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No area contains this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Point outside the coverage area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /score:
    get:
      summary: Get the precomputed composite score and sub-scores for an address.
      operationId: getScore
      parameters:
        - name: address
          in: query
          description: Free-text address. Mutually exclusive with lat/lon.
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
            format: double
        - name: lon
          in: query
          schema:
            type: number
            format: double
        - name: precision
          in: query
          description: >
            `grid` (default) returns the stored score of the containing grid cell.
            `point` scores the exact location on demand (an area: the mean of up to
            five sample points inside it) from live place queries and the metro's
            factor scales, and falls back to `grid` on any error. The response's
            `precision` says which was served.
          schema: { type: string, enum: [grid, point], default: grid }
      responses:
        "200":
          description: Score found.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponse"
        "400":
          description: Missing/invalid address or lat/lon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No geo entity within ingestion coverage for this location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /score/{geoEntityId}/explanation:
    get:
      summary: Generate a human-readable explanation of a stored score.
      operationId: getScoreExplanation
      parameters:
        - name: geoEntityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PriorityFactors"
        - $ref: "#/components/parameters/PriorityWeights"
      responses:
        "200":
          description: Explanation generated from the stored factor breakdown.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplanationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No score on file for this geo entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /isochrone:
    get:
      summary: >
        Area reachable from a point within N minutes by walking, driving or rail,
        from the precomputed road-network cell graph.
      operationId: getIsochrone
      parameters:
        - name: lat
          in: query
          required: true
          schema: {type: number, format: double}
        - name: lon
          in: query
          required: true
          schema: {type: number, format: double}
        - name: mode
          in: query
          schema: {type: string, enum: [walk, drive, transit], default: drive}
        - name: minutes
          in: query
          description: Time budget, 1-120 (capped per mode, walk 45, drive 90, transit 120). Default 15 / 30 / 45.
          schema: {type: integer, minimum: 1, maximum: 120}
      responses:
        "200":
          description: The reachable area as a GeoJSON MultiPolygon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsochroneResponse"
        "400":
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /triangulate:
    post:
      summary: >
        Rank precomputed addresses by proximity to a set of user-provided
        anchor points (job, school, landmark, etc).
      operationId: triangulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriangulateRequest"
      responses:
        "200":
          description: Ranked addresses within the intersected/unioned anchor isochrones.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriangulateResponse"
        "400":
          description: Invalid anchor list (e.g. fewer than 1 anchor, unresolvable address).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /optimize:
    post:
      summary: Find neighborhoods that minimise weekly travel to several destinations.
      description: >
        Takes anchors (an address such as work, a brand such as "Trader Joe's",
        or a category such as "gym") and returns the best-scoring, well-separated
        places to live: those with the lowest weekly travel time
        (`tripsPerWeek` x 2 for the round trip x minutes, summed over anchors),
        ties broken by the priority-weighted score. Brand and category anchors
        use the nearest matching place to each candidate. Walk and drive minutes
        are refined with live routing when available (`approx: false`);
        otherwise, and for transit, they are estimates (`approx: true`).
      operationId: optimize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeRequest"
      responses:
        "200":
          description: Ranked places with per-anchor travel details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResponse"
        "400":
          description: Invalid request (bad anchors, radius, limit, factors or weights).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A fixed (address) anchor is outside the covered metro area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /chat/stream:
    post:
      summary: The same chat as /chat, delivered as server-sent events.
      description: >
        Takes the same body as `/chat`. The response is `text/event-stream`:
        `status` frames (`{text, tool?}`) while the assistant works, then exactly
        one `reply` frame (the `/chat` JSON body) or one `error` frame
        (`{status, code, message}` using the codes of `/chat`). The reply text is
        sent whole after grounding validation, never as unvalidated tokens. A
        malformed body is rejected with a plain 400 before the stream starts.
        Behind API Gateway the frames arrive together at the end; true streaming
        needs a Lambda function URL (docs/ARCHITECTURE.md, Chat streaming).
      operationId: chatStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: A server-sent event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chat:
    post:
      summary: Ask Benri, a tool-using chat assistant grounded in our own data.
      description: >
        The client keeps the conversation and sends it each time; only the last
        6 messages (each cut to 2,000 characters) are used. The assistant can only
        call read-only tools (geocode, area_score, nearby_places, improve, similar,
        search_areas, optimize_location). `results` is built from tool output, not
        by the model; `reply` is checked against the tool output and replaced by a
        deterministic summary (`limited: true`) when it cannot be grounded. Each
        visitor gets 15 messages a day.
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: The assistant's reply with structured results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request (empty messages, unknown factor, last message not from the user).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The visitor used today's 15 chat messages (code `rate_limited`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Chat is unavailable (no API key, or the model call failed; code `chat_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /suggest:
    get:
      summary: Address autocomplete for the search box.
      description: >
        Returns up to `limit` place suggestions for a partially typed address,
        restricted to the covered metro area. Proxies a third-party geocoder
        (Photon, OpenStreetMap data) so the browser never talks to it directly
        and the provider can be swapped without a frontend change. Pass a
        suggestion's coordinates straight to `GET /score?lat=&lon=` — that
        skips geocoding entirely.
      operationId: suggestAddresses
      parameters:
        - name: q
          in: query
          required: true
          description: Text typed so far. At least 3 characters.
          schema:
            type: string
            minLength: 3
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Zero or more suggestions, best match first.
          headers:
            Cache-Control:
              description: Suggestions are cacheable for a few minutes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestResponse"
        "400":
          description: Missing or too-short `q`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            The geocoding provider is unavailable. Clients should degrade
            quietly to plain-text search rather than show an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reverse:
    get:
      summary: Readable address for a map point.
      description: >
        Reverse-geocodes a coordinate into a short label such as
        "350 5th Ave, New York, NY" (house number and street, locality, state
        abbreviation). Falls back to the street, then the neighbourhood name;
        `label` is null when nothing usable is known there. Proxies a
        third-party geocoder so the browser never talks to it directly. Clients
        should show coordinates (or nothing) rather than an error on failure.
      operationId: reverseGeocode
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: The label (possibly null) for the requested point.
          headers:
            Cache-Control:
              description: Cacheable for a few minutes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseResponse"
        "422":
          description: The point is outside the covered metro area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The geocoding provider is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /area/explanation:
    get:
      summary: Plain-language explanation for the area under a point.
      description: >
        Rule-based text from the area's factor scores. With
        `factors`, the text speaks to those priorities first.
      operationId: getAreaExplanation
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: double }
        - $ref: "#/components/parameters/PriorityFactors"
        - $ref: "#/components/parameters/PriorityWeights"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaExplanationResponse"
        "400":
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Nothing found for this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Point outside the coverage area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /improve:
    get:
      summary: What would raise the score nearby, for the selected factors.
      operationId: getImprove
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: double }
        - name: radiusMi
          in: query
          schema: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 3, default: 1 }
        - name: maxSuggestions
          in: query
          schema: { type: integer, minimum: 1, maximum: 5, default: 3 }
        - $ref: "#/components/parameters/PriorityFactors"
        - $ref: "#/components/parameters/PriorityWeights"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImproveResponse"
        "400":
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Nothing found for this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Point outside the coverage area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /similar:
    get:
      summary: Areas elsewhere in the metro with a similar factor profile.
      operationId: getSimilar
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: double }
        - name: k
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
        - name: minSeparationMi
          in: query
          schema: { type: number, minimum: 0, maximum: 10, default: 1 }
        - $ref: "#/components/parameters/PriorityFactors"
        - $ref: "#/components/parameters/PriorityWeights"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarResponse"
        "400":
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Nothing found for this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Point outside the coverage area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /places:
    get:
      summary: Nearest named places for one factor.
      operationId: getPlaces
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: double }
        - name: factor
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FactorKey"
        - name: radiusMi
          in: query
          schema: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 5, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacesResponse"
        "400":
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Nothing found for this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Point outside the coverage area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /map/cells:
    get:
      summary: Composite score per grid cell inside a map viewport.
      description: >
        Recomputes a composite score for every grid cell in `bbox` from the
        stored per-factor sub-scores, using only the factors you enable. It is
        a weighted average of precomputed numbers, not a recomputation from
        raw data, so it is cheap enough to call as the user toggles filters.
        Cells are returned as two parallel arrays (geohash cells and their
        scores) to keep the payload small. Zoomed out, request `precision=5`
        to get ~5 km cells (the average of the finer cells) instead of ~1 km
        cells.
      operationId: getMapCells
      parameters:
        - name: bbox
          in: query
          required: true
          description: Viewport as `minLon,minLat,maxLon,maxLat`.
          schema:
            type: string
            example: "-74.05,40.68,-73.85,40.82"
        - name: precision
          in: query
          description: Geohash length of the returned cells. 6 ≈ 1.2 km × 0.6 km, 5 ≈ 4.9 km × 4.9 km.
          schema:
            type: integer
            enum: [5, 6]
            default: 6
        - name: factors
          in: query
          description: >
            Comma-separated factors to include (see `FactorKey`). Omit for all
            thirteen. An explicit list means exactly those factors. At least
            one is required if present. The legacy keys `premiumRetail`,
            `trailPopularity`, `road`, `gasStation` and `convenienceStore` are
            accepted as aliases of `shopping`, `recreation`, `traffic`,
            `gasConvenience` and `gasConvenience`; duplicates collapse.
          schema:
            type: string
            example: "grocery,transit,recreation"
        - name: weights
          in: query
          description: >
            Optional `factor:weight` overrides, e.g. `transit:2,cafe:0.5`.
            Weights must be greater than 0 (to drop a factor, leave it out of
            `factors`). Factors without an override use the default
            hand-tuned weight. Overrides for factors not in `factors` are
            ignored.
          schema:
            type: string
            example: "transit:2,cafe:0.5"
        - name: limit
          in: query
          description: Maximum cells returned; `truncated` is true when more existed.
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 8000
      responses:
        "200":
          description: Scores for the cells in the viewport.
          headers:
            Cache-Control:
              description: Scores only change when the weekly refresh runs.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapCellsResponse"
        "400":
          description: Invalid bbox, unknown factor, or malformed weights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /map/top:
    get:
      summary: The best-scoring, well-separated areas for a set of factors.
      description: >
        Answers "where should I look?". Ranks cells by the same composite as
        `/map/cells`, then greedily keeps the best ones that are at least
        `minSeparationKm` apart, so you get distinct neighborhoods instead of
        ten adjacent cells in the same block. Scores are relative within each
        metro area, so no location scores 100 on *every* factor together;
        narrowing `factors` to one or two shows where each is at its maximum.
      operationId: getMapTop
      parameters:
        - name: bbox
          in: query
          description: Restrict to a viewport (`minLon,minLat,maxLon,maxLat`). Omit for the whole covered area.
          schema:
            type: string
        - name: factors
          in: query
          description: >
            Same as `/map/cells`: omitted means all thirteen factors (legacy
            keys accepted as aliases); an explicit list means exactly those factors.
          schema:
            type: string
        - name: weights
          in: query
          description: Same as `/map/cells`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: minSeparationKm
          in: query
          deprecated: true
          description: >
            Minimum distance between returned areas, in kilometres. Prefer
            `minSeparationMi`; sending both is a 400.
          schema:
            type: number
            minimum: 0
            maximum: 50
            default: 3
        - name: minSeparationMi
          in: query
          description: >
            Minimum distance between returned areas, in miles. Sending both
            this and `minSeparationKm` is a 400 invalid_request.
          schema:
            type: number
            minimum: 0
            maximum: 31
      responses:
        "200":
          description: Best areas first.
          headers:
            Cache-Control:
              description: Scores only change when the weekly refresh runs.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapTopResponse"
        "400":
          description: Invalid bbox, unknown factor, or malformed weights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /map/scores:
    get:
      summary: Compact binary file of every cell's 13 sub-scores.
      description: >
        Little-endian `uint32` header length, UTF-8 header JSON (`format`,
        `version`, `factors`, `count`, `geohashLength`, `generatedAt`), then
        `count` fixed 6-character ASCII geohashes (sorted), then `count * 13`
        `uint8` sub-scores in `factors` order (0-100, 255 = no score). Layout in
        docs/api.md. Gzip-encoded when accepted; supports `If-None-Match`.
      operationId: getMapScores
      parameters:
        - name: version
          in: query
          description: Weights version; must equal the served one.
          schema:
            type: string
      responses:
        "200":
          description: The score file.
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified.
        "404":
          description: Unknown version or no scores yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sources:
    get:
      summary: Data sources, licences and freshness.
      operationId: getSources
      responses:
        "200":
          description: The source registry with last successful ingestion per source.
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      required: [id, name, feeds, license, url]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        feeds: {type: string}
                        license: {type: string}
                        url: {type: string}
                        lastUpdated: {type: string, format: date-time, nullable: true}
                        rowsAffected: {type: integer, nullable: true}

  /feedback:
    post:
      summary: Send thumbs or a report about a summary, chat answer or place.
      operationId: postFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [summary, chat, place]}
                target: {type: string, maxLength: 200}
                rating: {type: integer, minimum: -1, maximum: 1}
                message: {type: string, maxLength: 1000}
      responses:
        "204":
          description: Stored (or dropped while migration 0011 is not applied).
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: More than 30 items from this visitor today.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase Auth session JWT (Google sign-in). Used by the web app for
        Free and Pro tier requests — Free tier still requires sign-in so
        usage can be attributed to an account.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Business-tier programmatic access. Key is account-scoped and hashed
        at rest (see `api_keys` table, Phase 4).

  parameters:
    PriorityFactors:
      name: factors
      in: query
      description: >
        Comma-separated factors the user cares about (see `FactorKey`).
        Omit for all 13 factors (legacy keys such as `premiumRetail` are accepted as aliases). Must not be empty if present.
      schema:
        type: string
        example: "grocery,transit,cafe"
    PriorityWeights:
      name: weights
      in: query
      description: Optional `factor:weight` importance overrides, as in `/map/cells`.
      schema:
        type: string
        example: "transit:2,cafe:0.5"

  headers:
    RateLimitLimit:
      description: Requests allowed in the current window for this account's tier.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Unix timestamp (seconds) when the current window resets.
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Missing or invalid session token / API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Account has exceeded its tier's rate limit for this window.
      headers:
        Retry-After:
          description: Seconds until the rate-limit window resets.
          schema:
            type: integer
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        upgradeUrl:
          type: string
          description: >
            Present on rate-limit errors for Free-tier accounts — link to
            the Pro upgrade flow (Stripe Checkout). Omitted otherwise.

    SubScores:
      type: object
      description: >
        Normalized 0-100 sub-scores. Direction is already applied — higher
        is always better, even for factors that are a negative raw signal
        (e.g. traffic or the noise corridor). A factor is null when there is
        no data for it at this location yet — that means "not measured",
        never 0. All 13 keys are always present. Rows scored with the older
        `v2-handtuned` model have no `gasConvenience` (null) and report
        `shopping` / `recreation` from their premium-retail / trail signals.
      properties:
        grocery: { type: number, nullable: true }
        gym: { type: number, nullable: true }
        cafe: { type: number, nullable: true }
        restaurant: { type: number, nullable: true }
        bar: { type: number, nullable: true }
        shopping: { type: number, nullable: true }
        gasConvenience: { type: number, nullable: true }
        transit: { type: number, nullable: true }
        school: { type: number, nullable: true }
        traffic: { type: number, nullable: true }
        emergencyCorridor: { type: number, nullable: true }
        airport: { type: number, nullable: true }
        recreation: { type: number, nullable: true }

    ScoreResponse:
      type: object
      required: [geoEntityId, address, latitude, longitude, compositeScore, subScores, weightsVersion, computedAt]
      properties:
        geoEntityId:
          type: string
          format: uuid
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        compositeScore:
          type: number
        subScores:
          $ref: "#/components/schemas/SubScores"
        weightsVersion:
          type: string
        computedAt:
          type: string
          format: date-time
        school:
          $ref: "#/components/schemas/SchoolInfo"
        neighborhood:
          type: string
          nullable: true
          description: >
            Human neighborhood name such as "Park Slope, Brooklyn" or "Montclair, NJ"
            (OpenStreetMap place nodes); null until the neighborhoods job has run or
            when nothing is nearby. For an area, the area's own label, else the
            representative cell's.
        precision:
          type: string
          enum: [grid, point]
          default: grid
          description: >
            `point` when scored on demand at the exact location (`?precision=point`),
            `grid` when it is the stored score of the containing cell.
        travelMode:
          type: string
          nullable: true
          enum: [walk, drive]
          description: >
            How people here usually get around, from population density: `walk` at
            10,000 or more people per square mile, otherwise `drive`. Null when the
            density is unknown. Clients use it to pick a default travel mode.

    AreaScoreResponse:
      description: >
        A `ScoreResponse` for a road-bounded area. `geoEntityId` is the
        representative grid cell (the one under the clicked point);
        `latitude`/`longitude` echo the clicked point; `address` is the
        area's label ("Area bounded by ...").
      allOf:
        - $ref: "#/components/schemas/ScoreResponse"
        - type: object
          required: [areaId, area, explanation]
          properties:
            areaId:
              type: integer
            area:
              type: object
              required: [geometry, areaSqMi, boundedBy, cellCount]
              properties:
                geometry:
                  type: object
                  description: GeoJSON Polygon or MultiPolygon, [lon, lat], 5 decimals.
                areaSqMi:
                  type: number
                boundedBy:
                  type: array
                  items: { type: string }
                  description: Up to 4 road names that form most of the boundary.
                cellCount:
                  type: integer
                  description: Number of grid cells blended into the score.
            explanation:
              type: string
              description: Plain-language "why this score", from the area's sub-scores.

    SchoolInfo:
      type: object
      nullable: true
      description: >
        School detail beside the `school` sub-score. `subScores.school` is
        null when no rating exists for the location; `proximity` (0-100,
        proximity+density only) is still reported so clients can show
        "proximity 72, rating unavailable".
      required: [ratingAvailable]
      properties:
        proximity: { type: number, nullable: true }
        ratingAvailable: { type: boolean }
        districtName: { type: string, nullable: true }
        source: { type: string, nullable: true }

    ExplanationResponse:
      type: object
      required: [geoEntityId, explanation, computedAt]
      properties:
        geoEntityId:
          type: string
          format: uuid
        explanation:
          type: string
          description: >
            Generated strictly from the retrieved factor breakdown for this
            geo entity — must not reference amenities or data not present in
            feature_store/scores.
        computedAt:
          type: string
          format: date-time
        nearestMi:
          type: object
          nullable: true
          description: >
            Distance in miles to the nearest feature per factor
            (FactorKey -> miles, null when unknown).
          additionalProperties:
            type: number
            nullable: true
        source:
          type: string
          enum: [ai, rules]
          description: Always `rules` today; `ai` is reserved for a possible return of LLM summaries.
        priorities:
          $ref: "#/components/schemas/Priorities"

    AnchorPoint:
      type: object
      description: A single user-provided anchor (job, school, landmark, etc).
      required: [label]
      properties:
        label:
          type: string
          description: User-facing name for this anchor, e.g. "Work".
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        maxTravelMinutes:
          type: integer
          description: Isochrone time budget from this anchor. Defaults to a server-side default if omitted.
        mode:
          type: string
          enum: [drive, transit, walk]
          default: drive

    TriangulateRequest:
      type: object
      required: [anchors]
      properties:
        anchors:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/AnchorPoint"
        combineMode:
          type: string
          enum: [intersect, union]
          default: intersect
          description: Whether candidate addresses must fall within all anchor isochrones (intersect) or any (union).
        limit:
          type: integer
          default: 50
        factors:
          type: string
          nullable: true
          description: Optional comma-separated factor keys (as on the map endpoints). When given, results are scored and ranked by these factors only.
        weights:
          type: string
          nullable: true
          description: Optional `factor:number` pairs (as on the map endpoints) weighting the selected factors.

    RankedAddress:
      type: object
      required: [geoEntityId, address, latitude, longitude, compositeScore]
      properties:
        geoEntityId:
          type: string
          format: uuid
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        compositeScore:
          type: number

    IsochroneShape:
      type: object
      required: [mode, minutes, method, cellCount, areaSqMi]
      description: >
        A reachable area. `method` is `network` when computed from the precomputed
        road-network cell graph (resolution one 0.58 x 0.38 mi cell) and `estimate` when
        the area has no routing data yet and a straight-line circle was used.
      properties:
        label:
          type: string
          nullable: true
        mode:
          type: string
          enum: [drive, transit, walk]
        minutes:
          type: integer
        method:
          type: string
          enum: [network, estimate]
        cellCount:
          type: integer
        areaSqMi:
          type: number
        geometry:
          type: object
          nullable: true
          description: GeoJSON MultiPolygon, coordinates [lon, lat].

    IsochroneResponse:
      type: object
      required: [latitude, longitude, isochrone]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        isochrone:
          $ref: "#/components/schemas/IsochroneShape"

    TriangulateResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/RankedAddress"
        isochrones:
          type: array
          description: One reachable area per anchor, in request order.
          items:
            $ref: "#/components/schemas/IsochroneShape"
        combined:
          $ref: "#/components/schemas/IsochroneShape"

    OptimizeAnchor:
      type: object
      required: [kind, query]
      properties:
        kind:
          type: string
          enum: [address, brand, category]
        query:
          type: string
          description: >
            An address, a brand or place name (case-insensitive, matches name or
            brand), or a category word (grocery, gym, cafe, restaurant, bar,
            transit, school, gas_station, convenience_store, plus common synonyms).
        latitude:
          type: number
          format: double
          description: Address anchors only; skips geocoding. Give with `longitude`.
        longitude:
          type: number
          format: double
        tripsPerWeek:
          type: number
          description: >
            One-way trips per week are counted twice (round trip). Defaults: 5 for
            the first address anchor (work), 3 for gyms, 1 otherwise.
        mode:
          type: string
          enum: [walk, drive, transit]
          description: Defaults to the request's `defaultMode`.

    OptimizeRequest:
      type: object
      required: [anchors]
      properties:
        anchors:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/OptimizeAnchor"
        defaultMode:
          type: string
          enum: [walk, drive, transit]
          default: drive
        radiusMi:
          type: number
          default: 15
          maximum: 30
          description: Candidate search radius in miles around the centroid of the fixed anchors.
        limit:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        factors:
          description: Priorities for the tie-break score; same keys as /map/top (comma-separated string or array).
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/FactorKey"
        weights:
          description: Importance overrides; `factor:number,...` string or a factor-to-number object.
          oneOf:
            - type: string
            - type: object
              additionalProperties:
                type: number

    OptimizeAnchorResult:
      type: object
      required: [query, kind, name, latitude, longitude, minutes, distanceLabel, mode, approx]
      properties:
        query:
          type: string
        kind:
          type: string
          enum: [address, brand, category]
        name:
          type: string
          description: The matched place (the nearest branch for brand and category anchors).
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        minutes:
          type: integer
          description: One-way travel minutes.
        distanceLabel:
          type: string
          nullable: true
          description: Straight-line distance in feet or miles, e.g. "0.4 mi".
        mode:
          type: string
          enum: [walk, drive, transit]
        approx:
          type: boolean
          description: True when minutes are estimated rather than routed.

    OptimizeResult:
      type: object
      required: [latitude, longitude, weeklyMinutes, score, anchors]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        neighborhood:
          type: string
          nullable: true
        areaLabel:
          type: string
          nullable: true
        weeklyMinutes:
          type: integer
          description: Total weekly travel minutes across all anchors, round trips included.
        score:
          type: integer
          description: Priority-weighted overall score, 0-100.
        anchors:
          type: array
          items:
            $ref: "#/components/schemas/OptimizeAnchorResult"

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content: {type: string, description: Cut to 2000 characters.}

    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/ChatMessage"}
          description: Must end with a user message; only the last 6 are used.
        context:
          type: object
          properties:
            address: {type: string}
            latitude: {type: number}
            longitude: {type: number}
            factors:
              type: array
              items: {$ref: "#/components/schemas/FactorKey"}
            weights:
              type: object
              additionalProperties: {type: number}

    ChatResult:
      type: object
      required: [label, latitude, longitude, why]
      properties:
        label: {type: string, description: Neighborhood name or area label.}
        latitude: {type: number}
        longitude: {type: number}
        score: {type: integer}
        weeklyMinutes: {type: integer}
        why: {type: string}

    ChatSource:
      type: object
      required: [tool, summary]
      properties:
        tool: {type: string}
        summary: {type: string}

    ChatPlanPoint:
      type: object
      required: [label, latitude, longitude]
      properties:
        label: {type: string}
        latitude: {type: number}
        longitude: {type: number}

    ChatPlan:
      type: object
      description: >
        Map setup built from the optimize_location result (never written by the
        model): the main address and up to two points of interest.
      required: [points]
      properties:
        place:
          description: The main address (e.g. work). Absent keeps the user's current place.
          allOf: [{$ref: "#/components/schemas/ChatPlanPoint"}]
        points:
          type: array
          maxItems: 2
          items: {$ref: "#/components/schemas/ChatPlanPoint"}

    ChatResponse:
      type: object
      required: [reply, results, sources]
      properties:
        reply: {type: string}
        results:
          type: array
          maxItems: 3
          items: {$ref: "#/components/schemas/ChatResult"}
        plan:
          $ref: "#/components/schemas/ChatPlan"
        sources:
          type: array
          items: {$ref: "#/components/schemas/ChatSource"}
        limited:
          type: boolean
          description: True when the reply is a deterministic fallback or chat is paused.

    OptimizeResponse:
      type: object
      required: [results, assumptions, unresolved]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/OptimizeResult"
        assumptions:
          type: array
          items:
            type: string
        unresolved:
          type: array
          items:
            type: object
            required: [query, reason]
            properties:
              query:
                type: string
              reason:
                type: string

    FactorKey:
      type: string
      description: >
        A scoring factor. Same keys as `SubScores`; each is a toggle on the
        website (none are hidden). Pill names: grocery "Groceries", gym "Gym",
        cafe "Cafes", restaurant "Restaurants", bar "Bars", shopping
        "Shopping", gasConvenience "Gas & Convenience", transit "Public
        transit", school "Schools", traffic "Traffic", emergencyCorridor
        "Noise Corridor" (main roads near fire stations, hospitals and police
        stations plus gas stations and convenience stores right next door), airport
        "Airport", recreation "Recreation" (parks and trails). Default relative
        weights: grocery 14, transit 14, emergencyCorridor 12, restaurant 10,
        school 10, gym 9, cafe 8, gasConvenience 6, bar 5, airport 5,
        recreation 5, shopping 4, traffic 4. Parameters that take factors also
        accept the legacy aliases `premiumRetail` (shopping), `trailPopularity`
        (recreation), `road` (traffic), `gasStation` and `convenienceStore`
        (gasConvenience). `/places` accepts `grocery`, `gym`, `cafe`,
        `restaurant`, `bar`, `shopping`, `recreation`, `gasConvenience`,
        `transit`, `school` and the legacy `gasStation`, `convenienceStore`,
        `premiumRetail`.
      enum:
        - grocery
        - gym
        - cafe
        - restaurant
        - bar
        - shopping
        - gasConvenience
        - transit
        - school
        - traffic
        - emergencyCorridor
        - airport
        - recreation

    Suggestion:
      type: object
      required: [label, latitude, longitude]
      properties:
        label:
          type: string
          example: "350 5th Avenue, New York, NY"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    SuggestResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/Suggestion"

    ReverseResponse:
      type: object
      required: [label, latitude, longitude]
      properties:
        label:
          type: string
          nullable: true
          example: "350 5th Ave, New York, NY"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    MapCellsResponse:
      type: object
      required: [precision, factors, weights, weightsVersion, count, truncated, geohashes, scores]
      properties:
        precision:
          type: integer
        factors:
          type: array
          description: The factors actually used.
          items:
            $ref: "#/components/schemas/FactorKey"
        weights:
          type: object
          description: The weight applied to each used factor.
          additionalProperties:
            type: number
        weightsVersion:
          type: string
        count:
          type: integer
        truncated:
          type: boolean
          description: True when the viewport held more cells than `limit`; zoom in or raise the limit.
        geohashes:
          type: array
          items:
            type: string
        scores:
          type: array
          description: Composite score 0-100 for `geohashes[i]`; same length as `geohashes`.
          items:
            type: number

    MapTopResult:
      type: object
      required: [geohash, latitude, longitude, score, metroArea, subScores]
      properties:
        geohash:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        score:
          type: number
          description: Composite for the requested factors/weights.
        metroArea:
          type: string
          example: nyc
        subScores:
          $ref: "#/components/schemas/SubScores"
        neighborhood: { type: string, nullable: true, description: "Human name such as Park Slope, Brooklyn." }

    MapTopResponse:
      type: object
      required: [factors, weights, weightsVersion, results]
      properties:
        factors:
          type: array
          items:
            $ref: "#/components/schemas/FactorKey"
        weights:
          type: object
          additionalProperties:
            type: number
        weightsVersion:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/MapTopResult"

    Priorities:
      type: array
      description: The factors the response was computed for.
      items:
        $ref: "#/components/schemas/FactorKey"

    AreaExplanationResponse:
      type: object
      required: [explanation, source, areaId]
      properties:
        explanation:
          type: string
        source:
          type: string
          enum: [ai, rules]
          description: Always `rules` today; `ai` is reserved for a possible return of LLM summaries.
        areaId:
          type: integer
          nullable: true
        priorities:
          $ref: "#/components/schemas/Priorities"
        neighborhood: { type: string, nullable: true, description: "Human name such as Park Slope, Brooklyn." }

    Place:
      type: object
      required: [name, distanceMi, distanceLabel, direction, latitude, longitude]
      properties:
        name: { type: string }
        brand: { type: string, nullable: true }
        category: { type: string }
        distanceMi: { type: number }
        distanceLabel: { type: string }
        direction: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    PlacesResponse:
      type: object
      required: [factor, radiusMi, places]
      properties:
        factor:
          $ref: "#/components/schemas/FactorKey"
        radiusMi: { type: number }
        places:
          type: array
          items:
            $ref: "#/components/schemas/Place"

    ImproveBetterArea:
      type: object
      required: [latitude, longitude, direction, distanceMi, distanceLabel, factorScore, factorGain, compositeScore, compositeGain]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        direction: { type: string }
        distanceMi: { type: number }
        distanceLabel: { type: string }
        factorScore: { type: number }
        factorGain: { type: number }
        compositeScore: { type: number }
        compositeGain: { type: number }
        neighborhood: { type: string, nullable: true, description: "Human name such as Park Slope, Brooklyn." }

    ImproveSuggestion:
      type: object
      required: [factor, label, score, places, tip]
      properties:
        factor:
          $ref: "#/components/schemas/FactorKey"
        label: { type: string }
        score: { type: number }
        places:
          type: array
          items:
            $ref: "#/components/schemas/Place"
        betterArea:
          allOf:
            - $ref: "#/components/schemas/ImproveBetterArea"
          nullable: true
        tip: { type: string }

    ImproveResponse:
      type: object
      required: [composite, radiusMi, suggestions]
      properties:
        composite: { type: number }
        radiusMi: { type: number }
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ImproveSuggestion"
        bestNearby:
          type: object
          nullable: true
          required: [latitude, longitude, direction, distanceLabel, compositeScore, compositeGain]
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
            direction: { type: string }
            distanceLabel: { type: string }
            compositeScore: { type: number }
            compositeGain: { type: number }
            neighborhood: { type: string, nullable: true, description: "Human name such as Park Slope, Brooklyn." }
        priorities:
          $ref: "#/components/schemas/Priorities"

    SimilarDifference:
      type: object
      required: [factor, label, delta]
      properties:
        factor:
          $ref: "#/components/schemas/FactorKey"
        label: { type: string }
        delta:
          type: number
          description: Signed; positive means the similar area scores higher.

    SimilarResult:
      type: object
      required: [latitude, longitude, direction, distanceLabel, similarity, compositeScore, differences, summary]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        direction: { type: string }
        distanceLabel: { type: string }
        similarity: { type: number, minimum: 0, maximum: 100 }
        compositeScore: { type: number }
        areaLabel: { type: string, nullable: true }
        neighborhood: { type: string, nullable: true, description: "Human name such as Park Slope, Brooklyn." }
        differences:
          type: array
          items:
            $ref: "#/components/schemas/SimilarDifference"
        summary: { type: string }

    SimilarResponse:
      type: object
      required: [minSeparationMi, results]
      properties:
        minSeparationMi: { type: number }
        results:
          type: array
          items:
            $ref: "#/components/schemas/SimilarResult"
        priorities:
          $ref: "#/components/schemas/Priorities"
